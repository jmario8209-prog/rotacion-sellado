<style>
:root{--bg:#f4f6f9;--card:#ffffff;--ink:#1d2433;--muted:#5f6b7d;--line:#dde3ea;--brand:#1f4e78;--brand-ink:#ffffff;--ok:#e8f3ec;--ok-ink:#1e6b3a;--warn:#fff4d6;--warn-ink:#7a5a00;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#11161d;--card:#1a212b;--ink:#e8edf3;--muted:#9aa7b8;--line:#2b3542;--brand:#3d7cb8;--brand-ink:#ffffff;--ok:#16301f;--ok-ink:#8fd6a6;--warn:#352b0c;--warn-ink:#f2d27a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 22px}
header h1{margin:0;font-size:1.25rem;font-weight:700}
header p{margin:6px 0 0;font-size:.95rem;opacity:.9}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
label{display:block;font-weight:600;margin:4px 0 8px}
input{width:100%;font-size:1.1rem;padding:14px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--brand)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 2px 0}
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;font-size:1rem;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.name{font-size:1.05rem;font-weight:700;margin:0 0 12px}
.puesto{font-size:1.5rem;font-weight:800;line-height:1.2;margin:0 0 14px;color:var(--brand)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-weight:700;text-align:right}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--ok);color:var(--ok-ink);font-weight:700;font-size:.9rem}
.off{background:var(--warn);color:var(--warn-ink)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
</style>
</head>

const $ = id => document.getElementById(id);
function norm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function card(p){
  if(p.x){return `<div class="card"><p class="name">${esc(p.n)}</p><span class="badge off">No programado esta semana</span><p class="hint">Si crees que es un error, consulta con tu supervisor.</p></div>`;}
  let h = `<div class="card"><p class="name">${esc(p.n)}</p><p class="puesto">${esc(p.p)}</p>`;
  h += `<div class="row"><span>L\u00ednea</span><span>${esc(p.l)}</span></div>`;
  h += `<div class="row"><span>Turno</span><span>${esc(p.t)}</span></div>`;
  if(p.m) h += `<div class="row"><span>Mesa</span><span>Mesa ${esc(p.m)}</span></div>`;
  return h + `</div>`;
}
function buscar(){
  const q = norm($("q").value);
  const out = $("res");
  if(q.length < 3){ out.innerHTML = ""; return; }
  const toks = q.split(" ");
  const hits = DATA.personas.filter(p => { const n = norm(p.n); return toks.every(t => n.includes(t)); });
  if(!hits.length){ out.innerHTML = `<p class="hint">No encontramos ese nombre. Revisa c\u00f3mo lo escribiste.</p>`; return; }
  if(hits.length === 1){ out.innerHTML = card(hits[0]); return; }
  out.innerHTML = `<div class="list">` + hits.slice(0,15).map((p,i)=>`<button class="opt" data-i="${DATA.personas.indexOf(p)}">${esc(p.n)}</button>`).join("") + `</div>`;
  out.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { out.innerHTML = card(DATA.personas[+b.dataset.i]); }));
}
if(DATA){
  $("semana").textContent = DATA.semana;
  $("pie").textContent = "Actualizado: " + DATA.generado;
  $("q").addEventListener("input", buscar);
} else {
  $("semana").textContent = "Sin datos";
}
